name: Deploy RecruitSage Backend to AWS EC2

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'data/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies & Build TypeScript
        run: |
          cd backend
          npm ci || npm install
          npm run build

  deploy:
    name: Deploy to EC2
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync Code to EC2 via Rsync
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no" \
            --exclude 'node_modules' \
            --exclude 'venv' \
            --exclude '__pycache__' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'extension' \
            ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/recruitsage/

      - name: Inject Production Secrets & Restart Service
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "cat > /opt/recruitsage/backend/.env" <<< "$ENV_CONTENT"
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
            set -e
            cd /opt/recruitsage/backend
            npm install
            npm run build
            sudo systemctl restart recruitsage
          '

      - name: Verify Live Production Health
        run: |
          echo "Waiting 5 seconds for backend reload..."
          sleep 5
          curl --fail -s https://${{ secrets.EC2_HOST }}.nip.io/api/health || curl --fail -s http://${{ secrets.EC2_HOST }}/api/health
          echo "Live Health Check Verified: OK!"
