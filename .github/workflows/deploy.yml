name: Deploy RecruitSage Backend to AWS EC2

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'data/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Python Syntax & App Imports
        run: |
          python -m py_compile backend/app/main.py backend/app/config.py backend/app/orchestrator.py
          PYTHONPATH=backend python -c "from app.main import app; print('App successfully verified!')"

  deploy:
    name: Deploy to EC2
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync Code to EC2 via Rsync
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no" \
            --exclude 'venv' \
            --exclude '__pycache__' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'extension' \
            ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/recruitsage/

      - name: Inject Production Secrets & Restart Service
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} bash -c "'
            set -e
            cd /opt/recruitsage

            cat << \"ENV_EOF\" > backend/.env
${{ secrets.ENV_FILE_CONTENT }}
ENV_EOF

            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install -r backend/requirements.txt
            sudo systemctl restart recruitsage
          '"

      - name: Verify Live Production Health
        run: |
          echo "Waiting 5 seconds for Uvicorn reload..."
          sleep 5
          curl --fail -s https://${{ secrets.EC2_HOST }}.nip.io/api/health || curl --fail -s http://${{ secrets.EC2_HOST }}/api/health
          echo "Live Health Check Verified: OK!"
